      <text x="728" y="406" class="small">Savings / secondary data</text>
      <text x="668" y="440" fill="#C8C4D1" font-size="12" font-weight="550">#00C8EF</text>

      <rect x="946" y="352" width="278" height="106" rx="18" fill="#17121E" stroke="#FFFFFF" stroke-opacity=".09"/>
      <rect x="960" y="366" width="48" height="48" rx="14" fill="#00D895"/>
      <text x="1022" y="384" fill="#F8F7FB" font-size="14" font-weight="650">Money in</text>
      <text x="1022" y="406" class="small">Positive / success</text>
      <text x="962" y="440" fill="#C8C4D1" font-size="12" font-weight="550">#00D895</text>

      <rect x="1240" y="352" width="278" height="106" rx="18" fill="#17121E" stroke="#FFFFFF" stroke-opacity=".09"/>
      <rect x="1254" y="366" width="48" height="48" rx="14" fill="#FF5368"/>
