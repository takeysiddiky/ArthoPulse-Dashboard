<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D610E6"/>
      <stop offset="1" stop-color="#9100EF"/>
    </linearGradient>
    <linearGradient id="brand-soft" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F927D7"/>
      <stop offset="1" stop-color="#A300DF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0467A8"/>
      <stop offset="1" stop-color="#00BDF2"/>
    </linearGradient>
    <linearGradient id="assistant" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#244989"/>
      <stop offset=".5" stop-color="#541D9A"/>
      <stop offset="1" stop-color="#9B18B8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".075"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".018"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .label { fill: #9B97A7; font-size: 13px; font-weight: 600; letter-spacing: 1.3px; }
      .title { fill: #F8F7FB; font-size: 36px; font-weight: 700; letter-spacing: -1.2px; }
      .body { fill: #D5D2DE; font-size: 16px; font-weight: 400; }
      .small { fill: #AAA6B5; font-size: 13px; font-weight: 500; }
      .card { fill: url(#glass); stroke: #FFFFFF; stroke-opacity: .09; }
    </style>
  </defs>

  <rect width="1920" height="1440" fill="#0B0A10"/>
  <circle cx="120" cy="20" r="520" fill="#8D14B8" fill-opacity=".08"/>
  <circle cx="1850" cy="770" r="500" fill="#282F85" fill-opacity=".07"/>

  <g id="page-header">
    <rect x="64" y="52" width="48" height="48" rx="15" fill="url(#brand)"/>
    <path d="M72 78h9l4.2-10 6.3 19 5.1-12.5 2.5 3.5h8" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 58a20 20 0 1 1-14.14 5.86" stroke="#fff" stroke-opacity=".48" stroke-width="1.8" stroke-linecap="round"/>
    <text x="128" y="78" fill="#F8F7FB" font-size="22" font-weight="700">ArthoPulse</text>
    <text x="128" y="101" fill="#AAA6B5" font-size="12" font-weight="500" letter-spacing=".4">SMART FINANCE, SMARTER FUTURE.</text>
    <rect x="1560" y="60" width="296" height="38" rx="19" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".09"/>
    <circle cx="1582" cy="79" r="4" fill="#00D895"/>
    <text x="1596" y="84" fill="#D5D2DE" font-size="13" font-weight="600">FOUNDATIONS + COMPONENTS</text>
    <text x="64" y="174" class="title">Design system</text>
    <text x="64" y="207" class="body">A calm, confident pulse for everyday money decisions.</text>
    <text x="64" y="235" class="small">Artho (অর্থ) — wealth, value  ·  Pulse (স্পন্দন) — rhythm, a living signal</text>
    <text x="1856" y="177" text-anchor="end" fill="#777481" font-size="13" font-weight="600">DESIGN LANGUAGE  /  01</text>
    <path d="M64 260H1856" stroke="#FFFFFF" stroke-opacity=".1"/>
  </g>

