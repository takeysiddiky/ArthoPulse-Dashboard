    <g id="neutral-colors">
      <text x="64" y="500" fill="#C8C4D1" font-size="13" font-weight="650">NEUTRALS</text>
      <rect x="64" y="516" width="278" height="76" rx="14" fill="#0B0A10" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="80" y="551" fill="#F8F7FB" font-size="13" font-weight="650">Canvas</text>
      <text x="80" y="574" fill="#AAA6B5" font-size="12">#0B0A10</text>
      <rect x="358" y="516" width="278" height="76" rx="14" fill="#121019" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="374" y="551" fill="#F8F7FB" font-size="13" font-weight="650">Raised surface</text>
      <text x="374" y="574" fill="#AAA6B5" font-size="12">#121019</text>
      <rect x="652" y="516" width="278" height="76" rx="14" fill="#191720" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="668" y="551" fill="#F8F7FB" font-size="13" font-weight="650">Glass surface</text>
