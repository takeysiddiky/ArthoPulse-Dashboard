    <text x="92" y="666" class="label">02  /  TYPOGRAPHY</text>
    <text x="892" y="666" text-anchor="end" class="small">Inter  ·  400 / 500 / 600 / 700 / 800</text>
    <text x="92" y="730" fill="#F8F7FB" font-size="38" font-weight="700" letter-spacing="-1.4">Money, made clearer.</text>
    <text x="92" y="759" fill="#AAA6B5" font-size="12" font-weight="500">DISPLAY / 38 · 700 · -1.4</text>
    <text x="92" y="817" fill="#F8F7FB" font-size="26" font-weight="700" letter-spacing="-.7">Monthly savings</text>
    <text x="92" y="843" fill="#AAA6B5" font-size="12" font-weight="500">HEADING / 26 · 700</text>
    <text x="500" y="817" fill="#F8F7FB" font-size="18" font-weight="600">Financial snapshot</text>
    <text x="500" y="843" fill="#AAA6B5" font-size="12" font-weight="500">TITLE / 18 · 600</text>
