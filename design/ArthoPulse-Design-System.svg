      <text x="80" y="440" fill="#C8C4D1" font-size="12" font-weight="550">#D610E6</text>
      <text x="321" y="440" text-anchor="end" fill="#C8C4D1" font-size="12" font-weight="550">#9100EF</text>

      <rect x="358" y="352" width="278" height="106" rx="18" fill="#17121E" stroke="#FFFFFF" stroke-opacity=".09"/>
